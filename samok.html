<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>삼목 10×10</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f1ea;
  --text: #1f1d1a;
  --muted: #625d55;
  --board: #d9b77a;
  --line: #7a5a2b;
  --black: #1b1b1b;
  --white: #fafafa;
  --stone-edge: #5c5c5c;
  --win: #d23b3b;
  --focus: #1f5fa8;
  --button-bg: #ffffff;
  --button-border: #c9c3b8;
  --dot-edge: #5c5c5c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614;
    --text: #ece9e3;
    --muted: #a8a299;
    --board: #b8925a;
    --line: #5a3f18;
    --button-bg: #24221f;
    --button-border: #45413b;
    --focus: #7fb0e0;
    --win: #ff5a5a;
    --dot-edge: #b5afa5;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.5;
}
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 0.9rem; margin-bottom: 10px; }
.back:hover { text-decoration: underline; }
a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.status { font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; margin: 0; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--dot-edge); }
.dot.black { background: var(--black); }
.dot.white { background: var(--white); }
button.action {
  font: inherit; font-size: 0.95rem; padding: 7px 14px; border-radius: 8px;
  border: 1px solid var(--button-border); background: var(--button-bg); color: var(--text); cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.board {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--board);
  border: 2px solid var(--line);
  border-radius: 6px;
  padding: 2px;
  touch-action: manipulation;
}
.cell {
  position: relative;
  appearance: none;
  border: 0;
  margin: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  min-width: 0;
}
/* 교차점 격자선 */
.cell::before, .cell::after {
  content: ""; position: absolute; background: var(--line); pointer-events: none;
}
.cell::before { left: 0; right: 0; top: 50%; height: 1px; }
.cell::after { top: 0; bottom: 0; left: 50%; width: 1px; }
.cell[data-col="0"]::before { left: 50%; }
.cell[data-col="9"]::before { right: 50%; }
.cell[data-row="0"]::after { top: 50%; }
.cell[data-row="9"]::after { bottom: 50%; }
.stone {
  position: absolute; inset: 9%; border-radius: 50%; z-index: 1;
  border: 1px solid var(--stone-edge);
  box-shadow: 0 1px 2px rgba(0,0,0,.35);
}
.stone.black { background: radial-gradient(circle at 35% 30%, #555, var(--black) 60%); }
.stone.white { background: radial-gradient(circle at 35% 30%, #fff, #dcdcdc 70%); }
.stone.last::after {
  content: ""; position: absolute; inset: 38%; border-radius: 50%; background: var(--win);
}
.stone.win { outline: 3px solid var(--win); outline-offset: 1px; }
.cell[aria-disabled="true"] { cursor: default; }
.cell[aria-disabled="false"]:hover .ghost { opacity: .35; }
.ghost { position: absolute; inset: 9%; border-radius: 50%; opacity: 0; z-index: 1; pointer-events: none; }
.ghost.black { background: var(--black); }
.ghost.white { background: var(--white); border: 1px solid var(--stone-edge); }
.settings { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px; }
.settings label { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; color: var(--muted); }
.settings select {
  font: inherit; font-size: 0.95rem; color: var(--text); background: var(--button-bg);
  border: 1px solid var(--button-border); border-radius: 8px; padding: 5px 8px;
}
select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.rules { color: var(--muted); font-size: 0.9rem; padding-left: 1.2em; margin: 16px 0 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← 게임 목록</a>
  <h1>삼목 10×10</h1>
  <p class="lede">흑과 백이 번갈아 돌을 놓아, 가로·세로·대각선으로 3개를 먼저 잇는 쪽이 이깁니다.</p>

  <div class="settings">
    <label>방식
      <select id="mode">
        <option value="cpu" selected>컴퓨터와</option>
        <option value="pvp">두 사람</option>
      </select>
    </label>
    <label data-cpu-only>나는
      <select id="color">
        <option value="black" selected>흑 (먼저)</option>
        <option value="white">백 (나중)</option>
      </select>
    </label>
    <label data-cpu-only>난이도
      <select id="level">
        <option value="easy" selected>쉬움</option>
        <option value="hard">어려움</option>
      </select>
    </label>
  </div>

  <div class="bar">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button type="button" class="action" id="restart">새 게임</button>
  </div>

  <div class="board" id="board" role="grid" aria-label="10×10 바둑판"></div>

  <ul class="rules">
    <li>흑이 먼저 두고 번갈아 둡니다. 컴퓨터와 두거나, 두 사람이 한 화면에서 둘 수 있습니다.</li>
    <li>3개 이상 이으면 이깁니다. 판이 가득 차면 무승부입니다.</li>
    <li>방식·색·난이도를 바꾸면 새 게임이 시작됩니다.</li>
  </ul>
</main>

<script id="game-core">
/*
 * 게임 규칙. 화면(DOM)을 건드리지 않는다.
 * tests/core.test.js 가 이 블록만 꺼내 시험한다.
 */
var GameCore = (function () {
  'use strict';

  var SIZE = 10;
  var WIN_LENGTH = 3;
  var BLACK = 'black';
  var WHITE = 'white';
  var DIRECTIONS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  function createGame(size, winLength) {
    var n = size || SIZE;
    var board = [];
    for (var r = 0; r < n; r++) {
      var row = [];
      for (var c = 0; c < n; c++) row.push(null);
      board.push(row);
    }
    return {
      size: n,
      winLength: winLength || WIN_LENGTH,
      board: board,
      turn: BLACK,
      moves: 0,
      status: 'playing', // 'playing' | 'won' | 'draw'
      winner: null,
      winLine: [],
      last: null
    };
  }

  function inBounds(game, r, c) {
    return r >= 0 && c >= 0 && r < game.size && c < game.size;
  }

  /* (r, c)에 놓인 돌을 지나는 가장 긴 줄 중, winLength 이상인 첫 줄의 칸들을 돌려준다. */
  function findWinLine(game, r, c) {
    var player = game.board[r][c];
    if (!player) return [];
    for (var d = 0; d < DIRECTIONS.length; d++) {
      var dr = DIRECTIONS[d][0];
      var dc = DIRECTIONS[d][1];
      var line = [[r, c]];
      var rr = r + dr, cc = c + dc;
      while (inBounds(game, rr, cc) && game.board[rr][cc] === player) {
        line.push([rr, cc]); rr += dr; cc += dc;
      }
      rr = r - dr; cc = c - dc;
      while (inBounds(game, rr, cc) && game.board[rr][cc] === player) {
        line.unshift([rr, cc]); rr -= dr; cc -= dc;
      }
      if (line.length >= game.winLength) return line;
    }
    return [];
  }

  /*
   * (r, c)에 지금 차례의 돌을 놓은 새 상태를 돌려준다. 원래 상태는 바꾸지 않는다.
   * 놓을 수 없으면(판 밖, 이미 돌이 있음, 게임 끝) 원래 상태를 그대로 돌려준다.
   */
  function play(game, r, c) {
    if (game.status !== 'playing') return game;
    if (!inBounds(game, r, c) || game.board[r][c]) return game;

    var board = game.board.map(function (row) { return row.slice(); });
    board[r][c] = game.turn;
    var next = {
      size: game.size,
      winLength: game.winLength,
      board: board,
      turn: game.turn === BLACK ? WHITE : BLACK,
      moves: game.moves + 1,
      status: 'playing',
      winner: null,
      winLine: [],
      last: [r, c]
    };

    var line = findWinLine(next, r, c);
    if (line.length) {
      next.status = 'won';
      next.winner = game.turn;
      next.winLine = line;
      next.turn = null;
    } else if (next.moves === game.size * game.size) {
      next.status = 'draw';
      next.turn = null;
    }
    return next;
  }

  /* ---------- 컴퓨터 상대 ---------- */

  function other(player) {
    return player === BLACK ? WHITE : BLACK;
  }

  /* 판만 복사한 계산용 상태. 돌을 놓았다 거두며 수를 따져 본다. */
  function scratchOf(game) {
    return {
      size: game.size,
      winLength: game.winLength,
      board: game.board.map(function (row) { return row.slice(); })
    };
  }

  function emptyCells(g) {
    var list = [];
    for (var r = 0; r < g.size; r++) {
      for (var c = 0; c < g.size; c++) {
        if (!g.board[r][c]) list.push([r, c]);
      }
    }
    return list;
  }

  function wouldWin(g, r, c, player) {
    g.board[r][c] = player;
    var win = findWinLine(g, r, c).length > 0;
    g.board[r][c] = null;
    return win;
  }

  /* player 가 다음 한 수로 이길 수 있는 빈칸들 */
  function winningCells(g, player) {
    return emptyCells(g).filter(function (p) { return wouldWin(g, p[0], p[1], player); });
  }

  /* (r, c)에 두면 player 가 이길 자리가 몇 곳 생기는지 */
  function threatsAfter(g, r, c, player) {
    g.board[r][c] = player;
    var n = winningCells(g, player).length;
    g.board[r][c] = null;
    return n;
  }

  /* 한 수로 이길 자리를 두 곳 이상 만드는 빈칸들(상대가 한 번에 다 막을 수 없음) */
  function forkCells(g, player, cells) {
    return cells.filter(function (p) { return threatsAfter(g, p[0], p[1], player) >= 2; });
  }

  /* 주변 돌과 판 가운데에 가까울수록 높은 점수. 같은 점수는 rng 로 고른다. */
  function positionScore(g, r, c, me) {
    var score = 0;
    for (var dr = -2; dr <= 2; dr++) {
      for (var dc = -2; dc <= 2; dc++) {
        if (!dr && !dc) continue;
        var rr = r + dr, cc = c + dc;
        if (!inBounds(g, rr, cc) || !g.board[rr][cc]) continue;
        var near = Math.max(Math.abs(dr), Math.abs(dc)) === 1 ? 3 : 1;
        score += g.board[rr][cc] === me ? near * 1.1 : near;
      }
    }
    var mid = (g.size - 1) / 2;
    return score - 0.05 * (Math.abs(r - mid) + Math.abs(c - mid));
  }

  function pick(cells, rng) {
    return cells[Math.floor(rng() * cells.length) % cells.length];
  }

  function bestByScore(g, cells, me, rng) {
    var best = [];
    var bestScore = -Infinity;
    cells.forEach(function (p) {
      var s = positionScore(g, p[0], p[1], me);
      if (s > bestScore + 1e-9) { bestScore = s; best = [p]; }
      else if (Math.abs(s - bestScore) <= 1e-9) best.push(p);
    });
    return pick(best, rng);
  }

  /* 이미 놓인 돌에서 한 칸 이내의 빈칸들. 없으면 모든 빈칸. */
  function nearbyCells(g, cells) {
    var near = cells.filter(function (p) {
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          var rr = p[0] + dr, cc = p[1] + dc;
          if ((dr || dc) && inBounds(g, rr, cc) && g.board[rr][cc]) return true;
        }
      }
      return false;
    });
    return near.length ? near : cells;
  }

  /*
   * 지금 차례(game.turn)인 쪽이 둘 칸 [행, 열]을 고른다. 게임이 끝났으면 null.
   * level: 'easy' | 'hard'. rng: 0 이상 1 미만을 돌려주는 함수(시험에서는 고정값).
   *
   * 쉬움: 이길 수 있으면 이김 → 상대가 이길 자리를 막음 → 돌 근처에 무작위
   * 어려움: 이김 → 막음 → 두 곳을 동시에 노리는 수 → 상대의 그런 수를 미리 막음 → 위치 점수
   */
  function chooseMove(game, level, rng) {
    if (game.status !== 'playing') return null;
    var random = rng || Math.random;
    var me = game.turn;
    var op = other(me);
    var g = scratchOf(game);
    var empties = emptyCells(g);
    if (!empties.length) return null;

    if (game.moves === 0) {
      var lo = Math.floor((g.size - 1) / 2), hi = Math.ceil((g.size - 1) / 2);
      return pick([[lo, lo], [lo, hi], [hi, lo], [hi, hi]], random);
    }

    var wins = winningCells(g, me);
    if (wins.length) return pick(wins, random);

    var blocks = winningCells(g, op);
    if (blocks.length) return pick(blocks, random);

    if (level === 'easy') return pick(nearbyCells(g, empties), random);

    var candidates = nearbyCells(g, empties);

    var myForks = forkCells(g, me, candidates);
    if (myForks.length) return bestByScore(g, myForks, me, random);

    var opForks = forkCells(g, op, candidates);
    if (opForks.length) {
      // 상대가 노리는 자리가 여럿이면, 이길 자리를 하나 만들어 상대가 막게 하면서 시간을 번다.
      // 그 수가 상대의 노림수 자리이기도 하면 가장 좋다.
      var forcing = candidates.filter(function (p) { return threatsAfter(g, p[0], p[1], me) >= 1; });
      var forcingOnFork = forcing.filter(function (p) {
        return opForks.some(function (f) { return f[0] === p[0] && f[1] === p[1]; });
      });
      if (forcingOnFork.length) return bestByScore(g, forcingOnFork, me, random);
      if (opForks.length > 1 && forcing.length) return bestByScore(g, forcing, me, random);
      return bestByScore(g, opForks, me, random);
    }

    return bestByScore(g, candidates, me, random);
  }

  return {
    SIZE: SIZE,
    WIN_LENGTH: WIN_LENGTH,
    BLACK: BLACK,
    WHITE: WHITE,
    createGame: createGame,
    play: play,
    findWinLine: findWinLine,
    chooseMove: chooseMove
  };
})();
</script>

<script id="game-ui">
/* 화면: GameCore 상태를 판에 그리고 클릭을 GameCore.play 로 넘긴다. 규칙 판정은 하지 않는다. */
(function () {
  'use strict';

  var NAMES = { black: '흑', white: '백' };
  var CPU_DELAY_MS = 350;
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var modeEl = document.getElementById('mode');
  var colorEl = document.getElementById('color');
  var levelEl = document.getElementById('level');
  var cpuOnly = document.querySelectorAll('[data-cpu-only]');
  var game = GameCore.createGame();
  var cells = [];
  var thinking = false;
  var gameId = 0; // 새 게임을 시작하면 늘린다. 예약된 컴퓨터 수가 지난 게임에 두지 않게 한다.

  function vsCpu() { return modeEl.value === 'cpu'; }
  function cpuColor() { return colorEl.value === 'black' ? 'white' : 'black'; }
  function isCpuTurn() { return vsCpu() && game.status === 'playing' && game.turn === cpuColor(); }

  function cpuMove() {
    if (!isCpuTurn()) return;
    thinking = true;
    render();
    var id = gameId;
    setTimeout(function () {
      if (id !== gameId) return;
      var move = GameCore.chooseMove(game, levelEl.value);
      if (move) game = GameCore.play(game, move[0], move[1]);
      thinking = false;
      render();
    }, CPU_DELAY_MS);
  }

  function newGame() {
    gameId += 1;
    thinking = false;
    game = GameCore.createGame();
    cpuOnly.forEach(function (el) { el.hidden = !vsCpu(); });
    render();
    cpuMove();
  }

  function stone(color, extra) {
    var el = document.createElement('span');
    el.className = 'stone ' + color + (extra || '');
    return el;
  }

  function build() {
    boardEl.replaceChildren();
    cells = [];
    for (var r = 0; r < game.size; r++) {
      var rowEl = document.createElement('div');
      rowEl.setAttribute('role', 'row');
      rowEl.style.display = 'contents';
      for (var c = 0; c < game.size; c++) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cell';
        btn.setAttribute('role', 'gridcell');
        btn.dataset.row = r;
        btn.dataset.col = c;
        btn.addEventListener('click', onCell);
        btn.addEventListener('keydown', onKey);
        rowEl.appendChild(btn);
        cells.push(btn);
      }
      boardEl.appendChild(rowEl);
    }
  }

  function onCell(e) {
    if (thinking || isCpuTurn()) return;
    var btn = e.currentTarget;
    var before = game;
    game = GameCore.play(game, Number(btn.dataset.row), Number(btn.dataset.col));
    render();
    if (game !== before) cpuMove();
  }

  /* 방향키로 칸 사이를 옮겨 다닌다. */
  function onKey(e) {
    var moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    var m = moves[e.key];
    if (!m) return;
    e.preventDefault();
    var r = Number(e.currentTarget.dataset.row) + m[0];
    var c = Number(e.currentTarget.dataset.col) + m[1];
    if (r < 0 || c < 0 || r >= game.size || c >= game.size) return;
    cells[r * game.size + c].focus();
  }

  function setStatus(color, text) {
    statusEl.replaceChildren();
    if (color) {
      var dot = document.createElement('span');
      dot.className = 'dot ' + color;
      dot.setAttribute('aria-hidden', 'true');
      statusEl.appendChild(dot);
    }
    statusEl.appendChild(document.createTextNode(text));
  }

  function render() {
    var wins = {};
    game.winLine.forEach(function (p) { wins[p[0] + ',' + p[1]] = true; });

    cells.forEach(function (btn) {
      var r = Number(btn.dataset.row);
      var c = Number(btn.dataset.col);
      var v = game.board[r][c];
      var label = (r + 1) + '행 ' + (c + 1) + '열';
      btn.replaceChildren();
      if (v) {
        var extra = '';
        if (game.last && game.last[0] === r && game.last[1] === c) extra += ' last';
        if (wins[r + ',' + c]) extra += ' win';
        btn.appendChild(stone(v, extra));
        label += ', ' + NAMES[v];
      } else if (game.status === 'playing' && !thinking && !isCpuTurn()) {
        var ghost = document.createElement('span');
        ghost.className = 'ghost ' + game.turn;
        btn.appendChild(ghost);
        label += ', 빈칸';
      } else {
        label += ', 빈칸';
      }
      // disabled 를 쓰면 키보드 포커스를 잃으므로 aria-disabled 로 표시만 한다. 놓을 수 없는 칸은 GameCore.play 가 무시한다.
      btn.setAttribute('aria-disabled', String(Boolean(v) || game.status !== 'playing' || thinking || isCpuTurn()));
      btn.setAttribute('aria-label', label);
    });

    if (game.status === 'won') {
      if (vsCpu()) {
        setStatus(game.winner, game.winner === cpuColor() ? '컴퓨터가 이겼습니다.' : '내가 이겼습니다!');
      } else {
        setStatus(game.winner, NAMES[game.winner] + ' 승리!');
      }
    } else if (game.status === 'draw') {
      setStatus(null, '무승부입니다.');
    } else if (isCpuTurn()) {
      setStatus(game.turn, '컴퓨터(' + NAMES[game.turn] + ') 생각 중…');
    } else {
      setStatus(game.turn, NAMES[game.turn] + ' 차례' + (vsCpu() ? ' (나)' : ''));
    }
  }

  document.getElementById('restart').addEventListener('click', function () {
    newGame();
    cells[0].focus();
  });
  [modeEl, colorEl, levelEl].forEach(function (el) { el.addEventListener('change', newGame); });

  build();
  newGame();
})();
</script>
</body>
</html>
