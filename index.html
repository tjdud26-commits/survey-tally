<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>간단한 게임 모음</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f1ea;
  --surface: #ffffff;
  --text: #1f1d1a;
  --muted: #625d55;
  --border: #d9d3c7;
  --accent: #8a5a2e;
  --focus: #1f5fa8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614;
    --surface: #211f1c;
    --text: #ece9e3;
    --muted: #a8a299;
    --border: #3d3934;
    --accent: #d9a46a;
    --focus: #7fb0e0;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.5;
}
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 20px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
a.card {
  display: block;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  color: inherit;
  text-decoration: none;
}
a.card:hover { border-color: var(--accent); }
a.card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.name { font-size: 1.15rem; font-weight: 700; display: block; }
.name::after { content: " →"; color: var(--accent); }
.desc { color: var(--muted); display: block; margin-top: 2px; }
.tags { display: block; margin-top: 8px; font-size: 0.85rem; color: var(--accent); }
.foot { color: var(--muted); font-size: 0.85rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>간단한 게임 모음</h1>
  <p class="lede">컴퓨터와 두거나, 두 사람이 한 화면에서 번갈아 둘 수 있습니다.</p>
  <ul>
    <li>
      <a class="card" href="mancala.html">
        <span class="name">만칼라</span>
        <span class="desc">구덩이의 씨앗을 한 칸씩 나눠 뿌려, 내 창고에 씨앗을 더 많이 모으는 쪽이 이깁니다.</span>
        <span class="tags">컴퓨터와 · 두 사람 · 한 판 5~10분</span>
      </a>
    </li>
    <li>
      <a class="card" href="samok.html">
        <span class="name">삼목 10×10</span>
        <span class="desc">10×10 판에서 가로·세로·대각선으로 돌 3개를 먼저 잇는 쪽이 이깁니다.</span>
        <span class="tags">컴퓨터와 · 두 사람 · 한 판 1~3분</span>
      </a>
    </li>
  </ul>
  <p class="foot">인터넷 연결 없이도 동작하고, 아무것도 저장하거나 보내지 않습니다.</p>
</main>
</body>
</html>
